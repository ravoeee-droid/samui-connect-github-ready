<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Volker Hamel GmbH – Website-Entwurf</title>
  <style>
    html,body{margin:0;min-height:100%;background:#16231a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    .loader{display:flex;align-items:center;gap:12px;font-size:14px;opacity:.82}
    .dot{width:10px;height:10px;border-radius:50%;background:#ba6d3d;animation:pulse 1s infinite alternate}
    @keyframes pulse{to{transform:scale(1.6);opacity:.45}}
  </style>
</head>
<body>
  <div class="loader"><span class="dot"></span>Entwurf wird geladen …</div>
  <script>
    fetch('https://raw.githubusercontent.com/ravoeee-droid/jj-media/main/entwurf/viehhandlung-hamel.html',{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
      .then(function(html){document.open();document.write(html);document.close();})
      .catch(function(){document.body.innerHTML='<main style="max-width:700px;padding:40px"><h1>Website-Entwurf</h1><p>Der Entwurf konnte gerade nicht geladen werden. Bitte laden Sie die Seite erneut.</p></main>';});
  </script>
</body>
</html>
